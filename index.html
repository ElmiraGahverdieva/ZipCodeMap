<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Location Tool</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231a73e8'/%3E%3Cpath d='M10 18 L24 12 L40 20 L54 14 L54 46 L40 52 L24 44 L10 50 Z' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3Cline x1='24' y1='12' x2='24' y2='44' stroke='white' stroke-width='2'/%3E%3Cline x1='40' y1='20' x2='40' y2='52' stroke='white' stroke-width='2'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
         display:flex;height:100vh;overflow:hidden;background:#f0f2f5}

    /* ── Sidebar ──────────────────────────────────────────────── */
    #sidebar{
      width:300px;min-width:240px;display:flex;flex-direction:column;
      background:#fff;border-right:1px solid #dde1e7;
      box-shadow:2px 0 8px rgba(0,0,0,.08);z-index:1000;overflow:hidden
    }
    .panel{
      display:flex;flex-direction:column;gap:7px;
      padding:12px 11px;flex:1;min-height:0;overflow:hidden
    }
    .panel+.panel{border-top:2px solid #e8eaed}

    .panel-title{
      font-size:11px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;display:flex;align-items:center;gap:5px;flex-shrink:0
    }
    .dot{width:11px;height:11px;border-radius:2px;flex-shrink:0}
    .dot-blue{background:#1a73e8}.dot-red{background:#d93025}.dot-gray{background:#9e9e9e}.dot-pink{background:#e91e63}

    textarea{
      flex:1;min-height:60px;padding:7px 8px;
      font-size:11.5px;font-family:"SF Mono","Courier New",monospace;
      border:1px solid #dadce0;border-radius:5px;background:#fafafa;
      color:#202124;resize:none;outline:none;line-height:1.55;transition:border-color .15s
    }
    #incInput:focus{border-color:#1a73e8;background:#fff}
    #excInput:focus{border-color:#d93025;background:#fff}
    #neuInput:focus{border-color:#757575;background:#fff}

    .btn-row{display:flex;gap:5px;flex-shrink:0}
    button{
      flex:1;padding:7px 4px;border:none;border-radius:5px;cursor:pointer;
      font-size:11.5px;font-weight:600;transition:opacity .15s
    }
    button:hover{opacity:.85} button:active{transform:scale(.97)}
    .btn-inc{background:#1a73e8;color:#fff}
    .btn-exc{background:#d93025;color:#fff}
    .btn-neu{background:#757575;color:#fff}
    .btn-clr{background:#fff;color:#5f6368;border:1px solid #dadce0}

    .prog-wrap{background:#e8eaed;border-radius:3px;height:3px;flex-shrink:0}
    .prog-bar{height:100%;border-radius:3px;width:0%;transition:width .3s}
    .pb-blue{background:#1a73e8}.pb-red{background:#d93025}.pb-gray{background:#9e9e9e}
    .status{font-size:11px;color:#5f6368;min-height:14px;flex-shrink:0;max-height:130px;overflow-y:auto}
    .status b{color:#202124}

    /* ── Legend ───────────────────────────────────────────────── */
    #legend{padding:9px 11px;border-top:1px solid #e8eaed;font-size:10.5px;color:#80868b;line-height:1.9;flex-shrink:0}
    .leg{display:flex;align-items:center;gap:5px}
    .sw{width:14px;height:9px;border-radius:2px;flex-shrink:0}

    /* ── Map ──────────────────────────────────────────────────── */
    #map{flex:1}

    /* ── Floating tooltip ─────────────────────────────────────── */
    #ft{
      position:fixed;display:none;z-index:9999;min-width:170px;max-width:240px;
      background:#fff;border:1px solid #dadce0;border-radius:8px;
      box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:12px;pointer-events:none
    }
    #ft.on{display:block;pointer-events:auto}
    #ft .fh{padding:8px 12px 5px;font-weight:700;font-size:13px;border-bottom:1px solid #f1f3f4}
    #ft .fs{padding:3px 12px 4px;color:#5f6368;font-size:11px;min-height:18px}
    #ft .fa{padding:5px 7px 7px;display:flex;flex-direction:column;gap:3px}
    .tb{
      width:100%;padding:5px 9px;border:none;border-radius:5px;text-align:left;
      cursor:pointer;font-size:11.5px;font-weight:500;transition:background .1s
    }
    .tb-r{background:#fff3f3;color:#c62828}.tb-r:hover{background:#fce8e6}
    .tb-b{background:#e8f0fe;color:#1558b0}.tb-b:hover{background:#d2e3fc}
    .tb-g{background:#f8f9fa;color:#5f6368}.tb-g:hover{background:#f1f3f4}
    .tb-p{background:#fce4ec;color:#880e4f}.tb-p:hover{background:#f8bbd0}

    .leaflet-tooltip{
      background:#1a73e8;border:none;color:#fff;font-weight:700;
      font-size:12px;padding:4px 10px;border-radius:4px;
      box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none;
      white-space:normal;line-height:1.5;min-width:160px;max-width:260px
    }
    .leaflet-tooltip.rt{background:#c62828}
    .leaflet-tooltip.nt{background:#616161}
    .leaflet-tooltip.pt{background:#880e4f}
    .leaflet-tooltip.hover-tip{background:#37474f;font-size:12px;padding:5px 10px;line-height:1.5;font-weight:400}
    .leaflet-tooltip.hover-tip b{font-weight:700}
    .leaflet-tooltip::before{display:none}

    /* ── Show All Areas control ───────────────────────────────── */
    .show-all-ctrl{margin:10px 0 0 10px}
    .show-all-ctrl button{
      background:#fff;border:2px solid #dadce0;border-radius:6px;
      padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;
      color:#3c4043;box-shadow:0 1px 4px rgba(0,0,0,.18);white-space:nowrap;
      transition:all .15s
    }
    .show-all-ctrl button:hover{background:#f8f9fa;border-color:#bdc1c6}
    .show-all-ctrl button.active{background:#e91e63;color:#fff;border-color:#e91e63;box-shadow:0 1px 6px rgba(233,30,99,.4)}

    /* ── Marked items panel ───────────────────────────────────── */
    .marked-item{display:flex;justify-content:space-between;align-items:baseline;
      padding:1px 0;line-height:1.65;color:#880e4f}
    .marked-del{cursor:pointer;color:#e91e63;font-weight:700;padding:0 2px;flex-shrink:0;margin-left:4px}
    .marked-del:hover{color:#880e4f}
  </style>
</head>
<body>

<div id="sidebar">

  <div class="panel">
    <div class="panel-title"><span class="dot dot-blue"></span>Included areas</div>
    <textarea id="incInput" placeholder="ZIP, штат, округ, страна:&#10;16112, Pennsylvania&#10;Allegheny County, PA&#10;Texas&#10;France"></textarea>
    <div class="btn-row">
      <button class="btn-inc" onclick="loadIncluded()">▶ Показать</button>
      <button class="btn-clr" onclick="clearIncluded()">✕</button>
    </div>
    <div class="prog-wrap"><div class="prog-bar pb-blue" id="iProg"></div></div>
    <div class="status" id="iStat">Готов</div>
  </div>

  <div class="panel">
    <div class="panel-title"><span class="dot dot-red"></span>Excluded areas</div>
    <textarea id="excInput" placeholder="ZIP, штат, округ, город:&#10;16117&#10;PA&#10;Pennsylvania&#10;Allegheny County, PA&#10;Lawrence County&#10;Pittsburgh"></textarea>
    <div class="btn-row">
      <button class="btn-exc" onclick="loadExcluded()">▶ Показать</button>
      <button class="btn-clr" onclick="clearExcluded()">✕</button>
    </div>
    <div class="prog-wrap"><div class="prog-bar pb-red" id="eProg"></div></div>
    <div class="status" id="eStat">Готов</div>
  </div>

  <div class="panel">
    <div class="panel-title"><span class="dot dot-gray"></span>Neutral areas</div>
    <textarea id="neuInput" placeholder="ZIP, штат, округ, страна:&#10;16112, Pennsylvania&#10;Allegheny County, PA&#10;Texas&#10;France"></textarea>
    <div class="btn-row">
      <button class="btn-neu" onclick="loadNeutral()">▶ Показать</button>
      <button class="btn-clr" onclick="clearNeutral()">✕</button>
    </div>
    <div class="prog-wrap"><div class="prog-bar pb-gray" id="nProg"></div></div>
    <div class="status" id="nStat">Готов</div>
  </div>

  <div id="markedPanel" class="panel" style="display:none;flex-shrink:0;max-height:220px">
    <div class="panel-title"><span class="dot dot-pink"></span>Отмечены для исключения</div>
    <div id="markedList" style="font-size:10.5px;overflow-y:auto;flex:1;min-height:24px;padding:2px 0"></div>
    <div class="btn-row">
      <button class="btn-exc" onclick="applyMarkedToExcluded()" style="background:#e91e63">→ В исключения</button>
      <button class="btn-clr" onclick="clearAllMarked()">✕</button>
    </div>
  </div>

  <div id="removedIncPanel" class="panel" style="display:none;flex-shrink:0;max-height:160px">
    <div class="panel-title"><span class="dot dot-blue"></span>Убраны из включённых</div>
    <div id="removedIncList" style="font-size:10.5px;color:#1558b0;overflow-y:auto;flex:1;min-height:24px;line-height:1.7"></div>
    <div class="btn-row"><button class="btn-clr" onclick="clearRemovedInc()">✕ Очистить</button></div>
  </div>

  <div id="removedPanel" class="panel" style="display:none;flex-shrink:0;max-height:160px">
    <div class="panel-title"><span class="dot" style="background:#34a853"></span>Убраны из исключений</div>
    <div id="removedList" style="font-size:10.5px;color:#1e7e34;overflow-y:auto;flex:1;min-height:24px;line-height:1.7"></div>
    <div class="btn-row"><button class="btn-clr" onclick="clearRemoved()">✕ Очистить</button></div>
  </div>

  <div id="legend">
    <div class="leg"><span class="sw" style="background:rgba(26,115,232,.22);border:1.5px solid #1a73e8"></span>Включённые ZIP</div>
    <div class="leg"><span class="sw" style="background:rgba(198,40,40,.28);border:1.5px solid #d93025"></span>Исключённые зоны</div>
    <div class="leg"><span class="sw" style="background:rgba(52,168,83,.6);border:2px solid #0a6b2e"></span>Пересечение включ. и исключ.</div>
    <div class="leg"><span class="sw" style="background:rgba(158,158,158,.22);border:1.5px solid #757575"></span>Нейтральные зоны</div>
    <div class="leg"><span class="sw" style="background:rgba(233,30,99,.28);border:1.5px solid #e91e63"></span>Отмечены для исключения</div>
    <div style="margin-top:3px;font-size:10px">Правый клик по зоне → меню</div>
  </div>
</div>

<div id="map"></div>

<div id="ft">
  <div class="fh" id="fh"></div>
  <div class="fs" id="fs"></div>
  <div class="fa" id="fa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script>
// ── US state lookup (for classification) ─────────────────────────────────────
const US_STATE_NAMES = new Set([
  'alabama','alaska','arizona','arkansas','california','colorado','connecticut',
  'delaware','florida','georgia','hawaii','idaho','illinois','indiana','iowa',
  'kansas','kentucky','louisiana','maine','maryland','massachusetts','michigan',
  'minnesota','mississippi','missouri','montana','nebraska','nevada',
  'new hampshire','new jersey','new mexico','new york','north carolina',
  'north dakota','ohio','oklahoma','oregon','pennsylvania','rhode island',
  'south carolina','south dakota','tennessee','texas','utah','vermont',
  'virginia','washington','west virginia','wisconsin','wyoming',
  'district of columbia'
]);
const US_STATE_ABBRS = new Set([
  'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA',
  'KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
  'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT',
  'VA','WA','WV','WI','WY','DC'
]);

// State full name → 2-letter abbreviation
const US_STATE_NAME_TO_ABBR = {
  'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
  'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',
  'hawaii':'HI','idaho':'ID','illinois':'IL','indiana':'IN','iowa':'IA',
  'kansas':'KS','kentucky':'KY','louisiana':'LA','maine':'ME','maryland':'MD',
  'massachusetts':'MA','michigan':'MI','minnesota':'MN','mississippi':'MS',
  'missouri':'MO','montana':'MT','nebraska':'NE','nevada':'NV',
  'new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY',
  'north carolina':'NC','north dakota':'ND','ohio':'OH','oklahoma':'OK',
  'oregon':'OR','pennsylvania':'PA','rhode island':'RI','south carolina':'SC',
  'south dakota':'SD','tennessee':'TN','texas':'TX','utah':'UT','vermont':'VT',
  'virginia':'VA','washington':'WA','west virginia':'WV','wisconsin':'WI',
  'wyoming':'WY','district of columbia':'DC'
};
function toStateAbbr(s) {
  if (!s) return '';
  if (s.length === 2) return s.toUpperCase();
  return US_STATE_NAME_TO_ABBR[s.toLowerCase()] || s.toUpperCase();
}

// State name → FIPS (for TIGERweb congressional district queries)
const US_STATE_FIPS = {
  'alabama':'01','alaska':'02','arizona':'04','arkansas':'05','california':'06',
  'colorado':'08','connecticut':'09','delaware':'10','florida':'12','georgia':'13',
  'hawaii':'15','idaho':'16','illinois':'17','indiana':'18','iowa':'19',
  'kansas':'20','kentucky':'21','louisiana':'22','maine':'23','maryland':'24',
  'massachusetts':'25','michigan':'26','minnesota':'27','mississippi':'28',
  'missouri':'29','montana':'30','nebraska':'31','nevada':'32',
  'new hampshire':'33','new jersey':'34','new mexico':'35','new york':'36',
  'north carolina':'37','north dakota':'38','ohio':'39','oklahoma':'40',
  'oregon':'41','pennsylvania':'42','rhode island':'44','south carolina':'45',
  'south dakota':'46','tennessee':'47','texas':'48','utah':'49','vermont':'50',
  'virginia':'51','washington':'53','west virginia':'54','wisconsin':'55',
  'wyoming':'56','district of columbia':'11'
};

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([39.5,-98.35],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

map.createPane('hoverPane');
map.getPane('hoverPane').style.zIndex = 310; // under all feature layers (default overlay = 400)
const incLayer     = L.featureGroup().addTo(map);
const excLayer     = L.featureGroup().addTo(map);
const neuLayer     = L.featureGroup().addTo(map);
const markedLayer  = L.featureGroup().addTo(map); // pink "marked as excluded"
const overlapLayer = L.featureGroup().addTo(map); // green intersection, on top

// ── State ─────────────────────────────────────────────────────────────────────
const exclusions   = new Map();   // key → {name, lyr}
const zipCtxCache  = new Map();   // zip → context object
let   serverStatus = null;
const removedItems    = [];
const removedIncItems = [];
const incLayers       = new Map(); // raw → L.geoJSON group (for direct removal)
const neuLayers       = new Map();
const markedItems     = new Map(); // key → {name, lyr}
let   _hideTipTimer = null;
let   _activeLayer  = null;
let   _activeStyle  = null;
let   _incGen = 0;   // incremented on clear — aborts in-flight loadIncluded
let   _excGen = 0;   // incremented on clear — aborts in-flight loadExcluded
let   _neuGen = 0;   // incremented on clear — aborts in-flight loadNeutral

// ── Nominatim serial queue — guarantees 1.2s between requests, race-condition-free ──
// All concurrent callers chain onto _nomMutex; each call runs only after the previous finishes.
let _nomLast  = 0;
let _nomMutex = Promise.resolve();
function nominatim(path) {
  return (_nomMutex = _nomMutex.then(async () => {
    const wait = Math.max(0, 1200 - (Date.now() - _nomLast));
    if (wait) await sleep(wait);
    _nomLast = Date.now();
    try {
      const r = await fetch('https://nominatim.openstreetmap.org' + path,
        { headers: { 'Accept-Language': 'en-US,en' } });
      if (!r.ok) throw new Error(`Nominatim HTTP ${r.status}`);
      return r.json();
    } catch(e) {
      console.warn('Nominatim failed:', path, e.message);
      return { type:'FeatureCollection', features:[] };
    }
  }));
}

// ── TIGERweb layer discovery ──────────────────────────────────────────────────
const TIGER_BASE = 'https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb';
// USDOT/NTAD re-publishes Census congressional district boundaries on a separate
// ArcGIS org — kept as an extra fallback source, tried after TIGERweb.
const NTAD_CD_URL = 'https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_Congressional_Districts/FeatureServer/0/query';
let tigerLayers = null;

async function getTigerLayers() {
  if (tigerLayers) return tigerLayers;

  // State_County is the dedicated service — try it first; it always has both
  // Other services are fallbacks for congressional districts (different Congress vintages
  // live on different services, so we keep ALL congressional matches, not just the first)
  const services = ['State_County', 'tigerWMS_Current', 'tigerWMS_ACS2023', 'tigerWMS_ACS2022', 'tigerWMS_Census2020'];

  let stateUrl = null, countyUrl = null;
  const cdUrls = [];

  for (const svc of services) {
    try {
      const r = await fetch(`${TIGER_BASE}/${svc}/MapServer?f=json`);
      if (!r.ok) continue;
      const { layers = [] } = await r.json();
      const base = `${TIGER_BASE}/${svc}/MapServer`;

      // Scan ALL layers in this service, picking the first match for each type
      for (const lyr of layers) {
        const n = lyr.name || '';
        if (!stateUrl  && /\bstate/i.test(n)  && !/subdivis/i.test(n))   stateUrl  = `${base}/${lyr.id}/query`;
        if (!countyUrl && /\bcounty\b|\bcounties\b/i.test(n))             countyUrl = `${base}/${lyr.id}/query`;
        if (/congressional/i.test(n))                                    cdUrls.push(`${base}/${lyr.id}/query`);
      }
    } catch(e) {
      console.warn('TIGERweb discovery failed for', svc, e.message);
    }
  }

  // Hard-coded fallbacks (stable Census endpoints) in case discovery fails
  if (!countyUrl) countyUrl = `${TIGER_BASE}/State_County/MapServer/1/query`;
  if (!stateUrl)  stateUrl  = `${TIGER_BASE}/State_County/MapServer/0/query`;

  // NTAD tried last — only useful if TIGERweb's vintages miss a requested district
  cdUrls.push(NTAD_CD_URL);

  tigerLayers = { stateUrl, countyUrl, cdUrls: [...new Set(cdUrls)] };
  console.log('TIGERweb layers:', tigerLayers);
  return tigerLayers;
}

// Reads a layer's actual field names so we don't have to guess field naming —
// different services name the state/district fields differently
// (STATEFP/CD119FP on TIGERweb vs. e.g. STATE_FIPS/DISTRICT on other ArcGIS orgs).
async function getLayerMeta(queryUrl) {
  try {
    const metaUrl = queryUrl.replace(/\/query$/, '');
    const r = await fetch(`${metaUrl}?f=json`);
    if (!r.ok) return null;
    const meta = await r.json();
    const names = (meta.fields || []).map(f => f.name);
    const stateField = names.find(n => /^statefp$/i.test(n))
                     || names.find(n => /state.*fips|fips.*state/i.test(n))
                     || names.find(n => /^state$/i.test(n));
    let cdFields = names.filter(n => /^CD\d*FP$/i.test(n));
    if (!cdFields.length) {
      const alt = names.find(n => /district/i.test(n) && !/name|label/i.test(n));
      if (alt) cdFields = [alt];
    }
    return { stateField, cdFields, allFields: names };
  } catch { return null; }
}

async function tigerQuery(url, where, outFields, maxCount = 50) {
  if (!url) return null;
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 10000);  // 10s timeout
  try {
    const params = new URLSearchParams({
      where, outFields, outSR:'4326', f:'geojson',
      resultRecordCount: String(maxCount),
    });
    const r = await fetch(`${url}?${params}`, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!r.ok) return null;
    const fc = await r.json();
    return hasPolygon(fc) ? fc : null;
  } catch { clearTimeout(tid); return null; }
}

// Reverse FIPS map: "13" → "georgia"
const _FIPS_TO_STATE = Object.fromEntries(Object.entries(US_STATE_FIPS).map(([s,f])=>[f,s]));

// Fetch congressional districts — local DB first, TIGERweb/NTAD as fallback.
// Different fallback sources (TIGERweb vintages, NTAD) use different field
// names for state and district number, so each candidate layer is
// introspected for its own field names instead of assuming Census naming
// everywhere. Results are merged across sources — a requested item may only
// exist in one of them (e.g. a now-superseded 2022 map vs. the current 119th
// Congress map).
async function fetchAllCDs(cdItems) {
  const result  = new Map();
  const needTiger = [];

  // Build FIPS for each item
  const reqItems = [];
  for (const item of cdItems) {
    const fips = US_STATE_FIPS[item.state];
    if (fips) reqItems.push({ state_fips: fips, cd_fp: item.num, _key: `${item.state}:${item.num}` });
    else needTiger.push(item);
  }

  // ── Try local DB endpoint ────────────────────────────────────────────────────
  if (reqItems.length) {
    try {
      const r = await fetch('/api/cd-batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reqItems.map(i => ({ state_fips: i.state_fips, cd_fp: i.cd_fp })))
      });
      if (r.ok) {
        const data = await r.json();
        const found = new Set();
        for (const [key, feat] of Object.entries(data)) {
          const [sfips, cdfp] = key.split(':');
          const state = _FIPS_TO_STATE[sfips];
          if (state) { result.set(`${state}:${cdfp}`, feat); found.add(`${state}:${cdfp}`); }
        }
        for (const item of reqItems) {
          if (!found.has(item._key)) needTiger.push({ state: item._key.split(':')[0], num: item._key.split(':')[1] });
        }
      } else {
        needTiger.push(...reqItems.map(i => ({ state: _FIPS_TO_STATE[i.state_fips]||'', num: i.cd_fp })));
      }
    } catch(e) {
      console.warn('CD local fetch failed:', e);
      needTiger.push(...reqItems.map(i => ({ state: _FIPS_TO_STATE[i.state_fips]||'', num: i.cd_fp })));
    }
  }

  // ── TIGERweb fallback for anything not found locally ────────────────────────
  if (needTiger.length) {
    const tigerMap = await _fetchAllCDsTiger(needTiger);
    for (const [k,v] of tigerMap) result.set(k, v);
  }

  return result;
}

async function _fetchAllCDsTiger(cdItems) {
  const tl = await getTigerLayers();
  if (!tl.cdUrls || !tl.cdUrls.length) return new Map();

  const fipsMap = new Map();  // fips → stateName
  const abbrMap = new Map();  // 2-letter abbr → stateName
  for (const item of cdItems) {
    const fips = US_STATE_FIPS[item.state];
    if (fips) fipsMap.set(fips, item.state);
    abbrMap.set(toStateAbbr(item.state), item.state);
  }
  if (!fipsMap.size) return new Map();

  const wanted = new Set(cdItems.map(i => `${i.state}:${i.num}`));
  const result = new Map(); // "state:nn" → GeoJSON feature

  for (const cdUrl of tl.cdUrls) {
    if (cdItems.every(i => result.has(`${i.state}:${i.num}`))) break;

    const meta = await getLayerMeta(cdUrl);
    if (!meta || !meta.stateField || !meta.cdFields.length) {
      console.warn('CD layer skipped (no usable fields):', cdUrl, meta && meta.allFields);
      continue;
    }

    const fipsList = [...fipsMap.keys()].map(f => `'${f}'`).join(',');
    const abbrList = [...abbrMap.keys()].map(a => `'${a}'`).join(',');
    const where = `${meta.stateField} IN (${fipsList}) OR ${meta.stateField} IN (${abbrList})`;

    for (const field of meta.cdFields) {
      const fc = await tigerQuery(cdUrl, where, `${meta.stateField},${field}`, 1000);
      if (!fc) continue;
      for (const feat of fc.features) {
        const raw = feat.properties[meta.stateField];
        const cd  = feat.properties[field];
        if (raw == null || cd == null) continue;
        const state = fipsMap.get(String(raw)) || abbrMap.get(String(raw).toUpperCase());
        if (!state) continue;
        const key = `${state}:${String(parseInt(cd)).padStart(2, '0')}`;
        if (!result.has(key)) result.set(key, feat);
      }
      if (result.size > 0) break;  // this layer's field worked, no need to try other field names on it
    }
  }
  console.log('CD lookup:', result.size, 'found of', wanted.size, 'requested; tried', tl.cdUrls.length, 'layer(s)');
  return result;
}

// ── Build included layer ──────────────────────────────────────────────────────
function buildIncLayer(fc){
  const lyrGroup = L.geoJSON(fc,{
    style:SI,
    onEachFeature(feat,lyr){
      const p   = feat.properties;
      const zip = p.ZCTA5CE20 || p.zip;
      const label = p.display_name || (zip ? `ZIP ${zip}` : p.NAME || '');
      lyr.bindTooltip(label, {sticky:true,offset:[10,0]});

      lyr.on('mousemove', function(e){
        if (!window.turf) return;
        try {
          const pt = turf.point([e.latlng.lng, e.latlng.lat]);
          const seen = new Set();
          const labels = [];
          incLayer.eachLayer(grp => {
            const innerLyrs = [];
            if (grp.eachLayer) grp.eachLayer(l => innerLyrs.push(l));
            else innerLyrs.push(grp);
            for (const l of innerLyrs) {
              if (!l.feature?.geometry) continue;
              if (l.getBounds && !l.getBounds().contains(e.latlng)) continue;
              try {
                if (turf.booleanPointInPolygon(pt, l.feature)) {
                  const lbl = l.feature.properties.display_name
                    || (l.feature.properties.ZCTA5CE20 ? `ZIP ${l.feature.properties.ZCTA5CE20}` : null)
                    || '';
                  if (lbl && !seen.has(lbl)) { seen.add(lbl); labels.push(lbl); }
                }
              } catch(_) {}
            }
          });
          const tip = this.getTooltip();
          if (tip) tip.setContent(labels.length > 1 ? labels.join(' | ') : label);
        } catch(_) {}
      });

      lyr.on('contextmenu', async function(e){
        L.DomEvent.preventDefault(e.originalEvent||e);
        setActiveLayer(this, this.options.style||SI);
        this.setStyle(SIH); this.bringToFront();
        if (zip) {
          showTip(e, `ZIP ${zip}`, '<i>определяю округ…</i>', buildIncActions(zip,null));
          const ctx = await loadZipCtx(zip, lyr.getBounds());
          showTip(e, `ZIP ${zip}`, ctx?formatLoc(ctx):'', buildIncActions(zip,ctx));
        } else {
          const rawLine = p._raw || '';
          const removeBtn = rawLine
            ? `<button class="tb tb-b" onclick="removeInclusion('${esc(rawLine)}')">✅ Убрать из включённых</button>`
            : '';
          showTip(e,
            `<span style="color:#1a73e8">${label}</span>`,
            'Включённая зона',
            `${removeBtn}<button class="tb tb-g" onclick="hideTipNow()">✕ Закрыть</button>`);
        }
      });
    }
  });
  fc.features?.forEach(f => {
    const raw = f.properties?._raw;
    if (raw) incLayers.set(raw, lyrGroup);
  });
  return lyrGroup;
}

function buildIncActions(zip, ctx){
  const a = [`<button class="tb tb-r" onclick="excludeAsZip('${zip}')">🚫 Исключить ZIP ${zip}</button>`];
  if(ctx?.county_name)
    a.push(`<button class="tb tb-r" onclick="excludeAsCounty('${esc(ctx.county_fips||'')}','${esc(ctx.county_name)}','${esc(ctx.state_abbr||'')}','${esc(ctx.state_name||'')}')">🚫 Исключить County: ${ctx.county_name}</button>`);
  if(ctx?.state_name)
    a.push(`<button class="tb tb-r" onclick="excludeAsState('${esc(ctx.state_fips||'')}','${esc(ctx.state_name)}','${esc(ctx.state_abbr||'')}')">🚫 Исключить State: ${ctx.state_name}</button>`);
  a.push(`<button class="tb tb-g" onclick="hideTipNow()">✕ Закрыть</button>`);
  return a.join('');
}

function formatLoc(ctx){
  const parts=[];
  if(ctx.county_name) parts.push(ctx.county_name);
  if(ctx.state_abbr)  parts.push(ctx.state_abbr);
  return parts.join(', ');
}

// ── ZIP context lookup ────────────────────────────────────────────────────────
async function loadZipCtx(zip, bounds){
  if(zipCtxCache.has(zip)) return zipCtxCache.get(zip);
  const st = await getServerStatus();

  let ctx = null;
  if(st.has_counties){
    try{
      const r = await fetch(`/api/zip-context?zip=${zip}`);
      ctx = await r.json();
    }catch{}
  }

  // Fallback: Nominatim reverse geocode
  if(!ctx?.county_name){
    try{
      const c = bounds.getCenter();
      const rev = await nominatim(`/reverse?lat=${c.lat}&lon=${c.lng}&format=json&addressdetails=1&zoom=10`);
      const a = rev.address||{};
      const sc = (a['ISO3166-2-lvl4']||'').replace(/^US-/,'');
      ctx = {
        county_name: a.county||a.city_district||'',
        state_name:  a.state||'',
        state_abbr:  sc||a.state_code||'',
        county_fips: null, state_fips: null,
        _nominatim_county: a.county||a.city_district||'',
        _nominatim_state:  a.state||'',
        _state_abbr:       sc
      };
    }catch{}
  }

  if(ctx) zipCtxCache.set(zip, ctx);
  return ctx;
}

    const r = await fetch(`/api/area-at?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}`);
    const d = r.ok ? await r.json() : null;
    const v = d?.county_fips ? d : null;
    _areaCache.set(key, v);

async function markArea(type, dataId) {
  hideTipNow();
  _clearHover();
  const data = _pendingAreaData.get(dataId);
  if (!data) return;

  let key, name, geom;
  if (type === 'county') {
    key  = `mark:county:${data.county_fips}`;
    name = `${data.county_name}, ${data.state_abbr}`;
    geom = data.county_geom;
  } else {
    key  = `mark:state:${data.state_fips}`;
    name = data.state_name;
    const fc = await fetchStateBoundary(data.state_abbr || data.state_name);
    if (!fc?.features?.length) return;
    geom = fc.features[0].geometry;
  }
  if (markedItems.has(key)) return;

  const fc = {type:'FeatureCollection', features:[{
    type:'Feature', properties:{display_name:name, _key:key}, geometry:geom
  }]};
  const lyr = _buildMarkedLayer(fc).addTo(markedLayer);
  markedItems.set(key, {name, lyr});
  _updateMarkedPanel();
  scheduleOverlap();
}

async function excludeAsZip(zip){
  hideTipNow();
  const key=`zip:${zip}`;
  if(exclusions.has(key)) return;
  try{
    const fc = await(await fetch(`/api/zcta?zips=${zip}`)).json();
    fc.features.forEach(f=>f.properties.display_name=`ZIP ${zip}`);
    addExclusion(key, `ZIP ${zip}`, fc);
    appendExcTA(zip);
  }catch(e){ console.error(e); }
}

async function excludeAsCounty(fips, name, stAbbr, stName){
  hideTipNow();
  const label = `${name}${stAbbr?', '+stAbbr:''}`;
  const key = `county:${fips||label}`;
  if(exclusions.has(key)) return;
  const cleanName = name.replace(/\s*county\s*$/i, '');
  const fc = await fetchCountyBoundary(cleanName, stAbbr);
  if(fc?.features?.length){
    fc.features.forEach(f=>f.properties.display_name=label);
    addExclusion(key, label, fc);
    appendExcTA(label);
  }
}

async function excludeAsState(fips, name, abbr){
  hideTipNow();
  const key = `state:${fips||name}`;
  if(exclusions.has(key)) return;
  const display = name||(abbr?'State '+abbr:'');
  const fc = await fetchStateBoundary(abbr || name);
  if(fc?.features?.length){
    fc.features.forEach(f=>f.properties.display_name=display);
    addExclusion(key, display, fc);
    appendExcTA(abbr||name);
  }
}

function addExclusion(key, name, fc){
  if(exclusions.has(key)) return;
  const lyr = buildExcLayer(fc, key).addTo(excLayer);
  exclusions.set(key, {name, lyr});
  updateExcStat();
  scheduleOverlap();
}

function removeExclusion(key){
  hideTipNow();
  const e = exclusions.get(key);
  if(!e) return;
  excLayer.removeLayer(e.lyr);
  exclusions.delete(key);
  // Remove from textarea
  const ta=$('excInput');

  $('removedPanel').style.display = '';
  updateExcStat();
  scheduleOverlap();
}

function removeInclusion(raw){

// ── Green intersection overlay ────────────────────────────────────────────────
let _overlapTimer = null;
function scheduleOverlap(){
  if (_overlapTimer) clearTimeout(_overlapTimer);
  _overlapTimer = setTimeout(_doOverlap, 500);
}

function _collectFeats(group) {
  const feats = [];
  group.eachLayer(child => {
    if (child.eachLayer) child.eachLayer(l => { if(l.feature) feats.push(l.feature); });
    else if (child.feature) feats.push(child.feature);
  });
  return feats;
}

function _doOverlap() {
  if (!window.turf) return;

  const incLyrs = [];
  incLayer.eachLayer(grp => {
    if (grp.eachLayer) grp.eachLayer(l => incLyrs.push(l));
    else incLyrs.push(grp);
  });

  // Reset all included layers to blue (skip active/highlighted layer)
  incLyrs.forEach(l => { if (l.setStyle && l !== _activeLayer) l.setStyle(SI); });

  const excFeats = [..._collectFeats(excLayer), ..._collectFeats(markedLayer)];
  if (!excFeats.length || !incLyrs.length) return;

  const useCentroid = incLyrs.length > 80;
  const excBboxes = excFeats.map(f => ({ f, bb: turf.bbox(f) }));

  for (const l of incLyrs) {
    if (!l.feature?.geometry) continue;
    const ib = turf.bbox(l.feature);
    for (const {f: exc, bb: eb} of excBboxes) {
      if (ib[0]>eb[2]||ib[2]<eb[0]||ib[1]>eb[3]||ib[3]<eb[1]) continue;
      try {
        let overlaps = false;
        if (useCentroid) {
          overlaps = turf.booleanPointInPolygon(turf.centroid(l.feature), exc);
        } else {
          overlaps = !!turf.intersect(turf.feature(l.feature.geometry), turf.feature(exc.geometry));
        }
        if (overlaps) {
          if (l !== _activeLayer) l.setStyle(SO);
          break;
        }
      } catch(_) {}
    }
  }
}

function appendExcTA(line){
  const ta=$('excInput'), v=ta.value.trim();
  const lines = v?v.split('\n'):[];
  if(!lines.some(l=>l.trim()===line.trim())) ta.value=(v?v+'\n':'')+line;
}

function updateExcStat(){
  const n=exclusions.size;
  setStat('eStat', n?`<b>${n}</b> зон исключено`:'Готов');
}

// ── Load included ─────────────────────────────────────────────────────────────
async function loadIncluded(){
  const gen = ++_incGen;
  const abort = () => _incGen !== gen;

  const rawLines = $('incInput').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!rawLines.length){ setStat('iStat','Нет данных'); return; }
  incLayer.clearLayers(); incLayers.clear(); overlapLayer.clearLayers(); setProg('iProg',2);

  const items  = rawLines.map(classifyExcLine).filter(Boolean);
  const byType = {
    zip:    items.filter(i=>i.type==='zip'),
    state:  items.filter(i=>i.type==='state'),
    county: items.filter(i=>i.type==='county'),
    cd:     items.filter(i=>i.type==='cd'),
    dma:    items.filter(i=>i.type==='dma'),
    place:  items.filter(i=>i.type==='place'),
    radius: items.filter(i=>i.type==='radius'),
  };
  const total = items.length;
  let loaded = 0;
  const notFoundList = [];

  const tick = (label) => {
    setProg('iProg', Math.round(5 + loaded/total*90));
    setStat('iStat', `${label} (${loaded}/${total})…`);
  };

  // 1. ZIPs — batch
  if (byType.zip.length) {
    const BATCH = 400;
    for (let i = 0; i < byType.zip.length; i += BATCH) {
      if (abort()) return;
      const batch = byType.zip.slice(i, i+BATCH);
      tick('ZIP-коды');
      try {
        const fc = await(await fetch(`/api/zcta?zips=${batch.map(z=>z.zip).join(',')}`)).json();
        if (abort()) return;
        const found = new Set(fc.features.map(f=>f.properties.ZCTA5CE20||f.properties.zip));
        batch.filter(z=>!found.has(z.zip)).forEach(z=>notFoundList.push(z.raw));
        loaded += found.size;
        if(fc.features.length) buildIncLayer(fc).addTo(incLayer);
      } catch { batch.forEach(z=>notFoundList.push(z.raw)); }
    }
  }

  // 2. Congressional districts — batch TIGERweb
  if (byType.cd.length) {
    if (abort()) return;
    tick('Округа Конгресса');
    const cdMap = await fetchAllCDs(byType.cd);
    if (abort()) return;
    for (const item of byType.cd) {
      const feat = cdMap.get(`${item.state}:${item.num}`);
      if (feat) {
        feat.properties.display_name = item.display;
        feat.properties._raw = item.raw;
        buildIncLayer({type:'FeatureCollection',features:[feat]}).addTo(incLayer);
        loaded++;
      } else notFoundList.push(item.raw);
    }
    tick('Округа Конгресса');
  }

  // 3. States — local DB → TIGERweb
  if (byType.state.length) {
    if (abort()) return;
    tick('Штаты');
    const localMap = await searchLocalBatch(byType.state.map(i=>i.name));
    if (abort()) return;
    for (const item of byType.state) {
      const fc = localMap.get(item.name);
      if (fc) {
        fc.features.forEach(f=>{f.properties.display_name=item.display;f.properties._raw=item.raw;});
        buildIncLayer(fc).addTo(incLayer); loaded++;
      } else {
        if (abort()) return;
        try {
          const fc2 = await fetchStateBoundary(item.name);
          if (abort()) return;
          if (hasPolygon(fc2)) {
            fc2.features.forEach(f=>{f.properties.display_name=item.display;f.properties._raw=item.raw;});
            buildIncLayer(fc2).addTo(incLayer); loaded++;
          } else notFoundList.push(item.raw);
        } catch { notFoundList.push(item.raw); }
      }
    }
    tick('Штаты');
  }

  // 4. Counties — local DB → TIGERweb
  if (byType.county.length) {
    if (abort()) return;
    tick('Округа');
    const localMap = await fetchCountiesBatchLocal(byType.county);
    if (abort()) return;
    const needTiger = [];
    for (const item of byType.county) {
      const stAbbr = toStateAbbr(item.state).toLowerCase();
      const feat = localMap.get(`${item.name.toLowerCase()}:${stAbbr}`)
                || localMap.get(`${item.name.toLowerCase()}:`);
      if (feat) {
        feat.properties.display_name = item.display; feat.properties._raw = item.raw;
        buildIncLayer({type:'FeatureCollection',features:[feat]}).addTo(incLayer); loaded++;
      } else needTiger.push(item);
    }
    if (needTiger.length) {
      if (abort()) return;
      const tigerMap = await fetchAllCounties(needTiger);
      if (abort()) return;
      for (const item of needTiger) {
        const feat = tigerMap.get(`${item.name.toLowerCase()}:${item.state.toLowerCase()}`)
                  || tigerMap.get(`${item.name.toLowerCase()}:`);
        if (feat) {
          feat.properties.display_name = item.display; feat.properties._raw = item.raw;
          buildIncLayer({type:'FeatureCollection',features:[feat]}).addTo(incLayer); loaded++;
        } else notFoundList.push(item.raw);
      }
    }
    tick('Округа');
  }

  // 5. DMA (Nielsen media markets) — server-side union of member counties
  if (byType.dma.length) {
    if (abort()) return;
    tick('DMA-рынки');
    const dmaMap = await fetchDmaBatch(byType.dma);
    if (abort()) return;
    for (const item of byType.dma) {
      const result = dmaMap.get(item.key);
      if (result?.fc?.features?.length) {
        result.fc.features.forEach(f=>{f.properties.display_name=item.display;f.properties._raw=item.raw;});
        buildIncLayer(result.fc).addTo(incLayer); loaded++;
      } else notFoundList.push(item.raw);
    }
    tick('DMA-рынки');
  }

  // 6. Places — local DB → Nominatim
  if (byType.place.length) {
    if (abort()) return;
    tick('Места');
    const dbMap = await searchLocalBatch(byType.place.map(i=>i.query));
    if (abort()) return;
    const needNom = [];
    for (const item of byType.place) {
      const fc = dbMap.get(item.query);
      if (fc) {
        fc.features.forEach(f=>{f.properties.display_name=item.display;f.properties._raw=item.raw;});
        buildIncLayer(fc).addTo(incLayer); loaded++;
      } else needNom.push(item);
    }
    for (const item of needNom) {
      if (abort()) return;
      tick(`Nominatim: ${item.display}`);
      try {
        let fc = await nomSearch(item.query, {countrycodes:'us'});
        if (abort()) return;
        if (!hasPolygon(fc)) fc = await nomSearch(item.query);
        if (abort()) return;
        if (hasPolygon(fc)) {
          fc.features.forEach(f=>{f.properties.display_name=item.display;f.properties._raw=item.raw;});
          buildIncLayer(fc).addTo(incLayer); loaded++;
        } else notFoundList.push(item.raw);
      } catch { notFoundList.push(item.raw); }
      tick('Места');
    }
  }

  // 7. Radius circles — batched parallel (10 at a time to avoid hammering Photon)
  if (byType.radius.length) {
    if (abort()) return;
    const all = byType.radius;
    let rDone = 0;
    tick(`Радиусы (0/${all.length})…`);
    const radiusResults = [];
    for (let i = 0; i < all.length; i += 10) {
      if (abort()) return;
      const batch = all.slice(i, i + 10);
      const res = await Promise.all(batch.map(async item => {
        try { const fc = await fetchRadius(item); tick(`Радиусы (${++rDone}/${all.length})…`); return { item, fc }; }
        catch { return { item, fc: null }; }
      }));
      radiusResults.push(...res);
    }
    if (abort()) return;
    for (const { item, fc } of radiusResults) {
      if (fc?.features?.length) {
        fc.features.forEach(f=>f.properties._raw=item.raw);
        buildIncLayer(fc).addTo(incLayer); loaded++;
      } else notFoundList.push(item.raw);
    }
  }

  if (abort()) return;
  setProg('iProg',100);
  if(incLayer.getLayers().length) map.fitBounds(incLayer.getBounds(),{padding:[30,30]});
  scheduleOverlap();

  const parts = [`✅ <b>${loaded}</b>/${total} загружено`];
  if (notFoundList.length) {
    const listHtml = notFoundList.map(s=>`<span style="color:#c62828">• ${s}</span>`).join('<br>');
    setStat('iStat', parts.join(' · ') + ` · ⚠️ не найдено: <b>${notFoundList.length}</b><div style="margin-top:4px;line-height:1.6">${listHtml}</div>`);
  } else {
    setStat('iStat', parts.join(' · '));
  }
}

// ── Input classifier ─────────────────────────────────────────────────────────
// Returns {type, zip|name|query, state, display, key}
function classifyExcLine(raw) {
  let line = raw.trim();
  if (!line) return null;

  // ── Nielsen DMA® media market, e.g.:
  // "Knoxville, TN, Tennessee, United States (Nielsen DMA®)"
  // "Tri-Cities, TN-VA, Virginia, United States (Nielsen DMA®)"
  // Must run before the generic trailing-paren stripper below — that regex
  // is letter-only and doesn't match "®", so it never strips this suffix.
  const dmaM = line.match(/^(.+?),\s*([A-Za-z]{2}(?:-[A-Za-z]{2})*)\s*,\s*([^,]+?)\s*,\s*United States\s*\(\s*Nielsen\s*DMA[®\s]*\)\s*$/i);
  if (dmaM) {
    const name = dmaM[1].trim();
    const states = dmaM[2].toUpperCase();
    const display = `${name}, ${states} (Nielsen DMA)`;
    return { raw, type:'dma', name, states, display, key:`dma:${name.toLowerCase()}:${states}` };
  }

  // Strip trailing type annotations: "(city)", "(county)", "(state/province)", etc.
  // Uses letter-only pattern — does NOT strip coordinate strings like "(32.8,-116.7)"
  line = line.replace(/\s*\([a-zA-Z\/\s-]{3,}\)\s*$/, '').trim();

  // Strip trailing country qualifiers
  line = line
    .replace(/,?\s*(united states of america|united states|u\.s\.a?\.)\s*$/i, '')
    .replace(/,?\s*\busa\b\s*$/i, '')
    .replace(/,?\s*\bcanada\b\s*$/i, '')
    .replace(/,\s*United\s*$/i, '')   // truncated ", United" at end
    .replace(/,\s*$/, '')
    .trim();
  if (!line) return null;

  const parts = line.split(/\s*,\s*/);
  const first = parts[0].trim();

  // ── ZIP code (5 digits) ──
  if (/^\d{5}$/.test(first)) {
    return { raw, type:'zip', zip:first, display:`ZIP ${first}`, key:`zip:${first}` };
  }

  // ── 2-letter US state abbreviation (PA, NY …) ──
  if (parts.length === 1 && /^[A-Z]{2}$/i.test(first) && US_STATE_ABBRS.has(first.toUpperCase())) {
    return { raw, type:'state', name:first.toUpperCase(), display:first,
             key:`state:${first.toLowerCase()}` };
  }

  // ── Congressional district: "Georgia's 2nd Congressional District …" ──
  const cdM = line.match(/^([A-Za-z][A-Za-z\s]+?)'s?\s+(\d+)(?:st|nd|rd|th)?\s+congressional\s+district/i);
  if (cdM) {
    const state = cdM[1].trim().toLowerCase();
    const num   = parseInt(cdM[2], 10);
    const padded = String(num).padStart(2, '0');
    const display = `${cdM[1].trim()} CD-${num}`;
    return { raw, type:'cd', state, num: padded, display, key:`cd:${state}:${padded}` };
  }

  // ── County / Parish / Borough (Louisiana parishes, Alaska boroughs) ──
  if (/\b(county|parish|borough)\b/i.test(first)) {
    const sfxM   = first.match(/\b(county|parish|borough)\b/i);
    const suffix = sfxM ? sfxM[1].toLowerCase() : 'county';
    const countyName = first.replace(/\s*(county|parish|borough)\s*$/i, '').trim();
    const state = parts.length > 1 ? parts[parts.length - 1].trim() : '';
    const display = first + (state ? `, ${state}` : '');
    return { raw, type:'county', name:countyName, state, display, suffix,
             query: first + (state ? `, ${state}` : ''),
             key: `county:${display.toLowerCase()}` };
  }

  // ── Radius: "25.0|mi|Fresno, CA"  or  "20 miles around Denver, CO" ──
  const rpipe   = line.match(/^(\d+(?:\.\d+)?)\s*\|mi(?:les?)?\|\s*(.+)$/i);
  const raround = !rpipe && line.match(/^(\d+(?:\.\d+)?)\s*mi(?:les?)?\s+around\s+(.+)$/i);
  const rm = rpipe || raround;
  if (rm) {
    const dist  = parseFloat(rm[1]);
    const place = rm[2].trim();
    return { raw, type:'radius', dist, place,
             display: `${dist} mi вокруг ${place}`,
             key: `radius:${dist}:${place.toLowerCase()}` };
  }

  // ── Everything else: country, province, state by full name, city ──
  // searchLocal() will find these in countries/admin1 tables
  return { raw, type:'place', query:line, display:first || line,
           key:`place:${line.toLowerCase()}` };
}

function hasPolygon(fc) {
  return fc?.features?.some(f =>
    f?.geometry?.type === 'Polygon' || f?.geometry?.type === 'MultiPolygon'
  );
}

async function nomSearch(query, opts = {}) {
  const p = new URLSearchParams({ q:query, format:'geojson', polygon_geojson:'1', limit:'1' });
  if (opts.countrycodes) p.set('countrycodes', opts.countrycodes);
  if (opts.featuretype)  p.set('featuretype',  opts.featuretype);
  return nominatim(`/search?${p}`);
}

// Geocode a place name → [lng, lat].
// Uses Photon (Komoot) — OSM data, no rate limit, parallel-friendly.
// Falls back to Nominatim (rate-limited) only if Photon fails.
async function geocodePoint(query) {
  // Check localStorage cache first
  const ck = query.toLowerCase();
  const cached = _geoCache(ck);
  if (cached) return cached;

  // Photon: fast, no rate limit, great for city/address queries
  try {
    const url = 'https://photon.komoot.io/api/?' +
      new URLSearchParams({ q: query, limit: '1', lang: 'en' });
    const j = await (await fetch(url)).json();
    const coords = j?.features?.[0]?.geometry?.coordinates;
    if (coords && !coords.some(isNaN)) {
      const pt = [coords[0], coords[1]];
      _geoCache(ck, pt);
      return pt;
    }
  } catch(e) { console.warn('Photon failed:', query, e.message); }

  // Nominatim fallback — goes through serial queue, no rate-limit race
  try {
    const p = new URLSearchParams({ q: query, format: 'json', limit: '1', countrycodes: 'us' });
    const res = await nominatim(`/search?${p}`);
    const arr = Array.isArray(res) ? res : res?.features?.map ? null : null;
    const item0 = Array.isArray(res) ? res[0] : null;
    if (item0?.lat) {
      const pt = [parseFloat(item0.lon), parseFloat(item0.lat)];
      _geoCache(ck, pt);
      return pt;
    }
    // GeoJSON fallback (in case Nominatim returns geojson)
    const f = res?.features?.[0];
    if (f?.geometry?.coordinates) {
      const coords = f.geometry.type === 'Point'
        ? f.geometry.coordinates
        : turf.centroid(f).geometry.coordinates;
      const pt = [coords[0], coords[1]];
      _geoCache(ck, pt);
      return pt;
    }
  } catch(e) { console.warn('geocodePoint Nominatim failed:', query, e.message); }
  return null;
}

// localStorage cache for geocoded radius centers (survives page reload)
function _geoCache(key, val) {
  try {
    const s = '_rc';
    if (val !== undefined) {
      const c = JSON.parse(localStorage.getItem(s) || '{}');
      c[key] = val;
      localStorage.setItem(s, JSON.stringify(c));
    } else {
      return JSON.parse(localStorage.getItem(s) || '{}')[key] || null;
    }
  } catch { return null; }
}

// Build a circle polygon around a place or coordinates
async function fetchRadius(item) {
  let lngLat;
  const p = item.place;

  // Format: "(lat,lng)"
  const coordM = p.match(/^\(\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*\)$/);
  if (coordM) {
    lngLat = [parseFloat(coordM[2]), parseFloat(coordM[1])];
  }

  // Format: "Lat: 34.05 Long: -118.24" or "Lat 34.05 Long -118.24"
  if (!lngLat) {
    const llM = p.match(/lat(?:itude)?[:\s]+(-?\d+\.?\d*)\s+long(?:itude)?[:\s]+(-?\d+\.?\d*)/i);
    if (llM) lngLat = [parseFloat(llM[2]), parseFloat(llM[1])];
  }

  // Extract ZIP from address → use local ZCTA DB (fast, no Nominatim)
  if (!lngLat) {
    const zipM = p.match(/\b(\d{5})(?:-\d{4})?\b/);
    if (zipM) {
      try {
        const fc = await (await fetch(`/api/zcta?zips=${zipM[1]}`)).json();
        if (fc?.features?.length)
          lngLat = turf.centroid(fc.features[0]).geometry.coordinates;
      } catch(_) {}
    }
  }

  // Geocode via Photon → Nominatim (cache handled inside geocodePoint)
  if (!lngLat) lngLat = await geocodePoint(p);

  if (!lngLat || lngLat.some(isNaN)) return null;
  const circle = turf.circle(lngLat, item.dist, { steps: 64, units: 'miles' });
  circle.properties = { display_name: item.display, region_type: 'radius' };
  return { type: 'FeatureCollection', features: [circle] };
}

// Fetch US state boundary: local DB (admin1) → TIGERweb → Nominatim
async function fetchStateBoundary(name) {
  // admin1 table has all US states from Natural Earth
  const local = await searchLocal(name);
  if (local) return local;
  // TIGERweb for higher-res Census boundary
  const tl = await getTigerLayers();
  if (tl.stateUrl) {
    const safe  = name.replace(/'/g, "''");
    const where = name.length === 2
      ? `STUSAB='${safe.toUpperCase()}'`
      : `NAME='${safe}'`;
    const fc = await tigerQuery(tl.stateUrl, where, 'NAME,STUSAB');
    if (fc) return fc;
  }
  return nomSearch(name + ' state', { countrycodes:'us' });
}

// Fetch US county boundary: local DB → TIGERweb → Nominatim
// Used by hover-to-exclude tooltip (single county)
async function fetchCountyBoundary(name, state) {
  const q = name + ' county' + (state ? ` ${state}` : '');
  const local = await searchLocal(q);
  if (local) return local;
  const tl = await getTigerLayers();
  if (tl.countyUrl) {
    const safe = name.replace(/'/g, "''");
    let where  = `NAME='${safe}'`;
    if (state) where += ` AND STUSAB='${state.toUpperCase()}'`;
    const fc = await tigerQuery(tl.countyUrl, where, 'NAME,STUSAB,NAMELSAD');
    if (fc) return fc;
  }
  return nomSearch(q + ' USA', { countrycodes:'us' });
}

// Batch county fetch for loadExcluded — parallel TIGERweb requests
async function fetchAllCounties(countyItems) {
  const tl = await getTigerLayers();
  if (!tl.countyUrl) return new Map();

  // Build OR conditions — convert full state names to 2-letter abbreviations
  const conds = countyItems.map(item => {
    const safe  = item.name.replace(/'/g, "''");
    const abbr  = toStateAbbr(item.state);
    return abbr
      ? `(NAME='${safe}' AND STUSAB='${abbr}')`
      : `NAME='${safe}'`;
  });

  // TIGERweb has a URL limit — chunk into batches of 80, fire ALL in parallel
  const chunks = [];
  for (let i = 0; i < conds.length; i += 80)
    chunks.push(conds.slice(i, i + 80));

  const responses = await Promise.all(
    chunks.map(chunk => tigerQuery(tl.countyUrl, chunk.join(' OR '), 'NAME,STUSAB,NAMELSAD', 500))
  );

  const result = new Map();
  for (const fc of responses) {
    if (!fc) continue;
    for (const feat of fc.features) {
      const n = (feat.properties.NAME || '').toLowerCase();
      const s = (feat.properties.STUSAB || '').toLowerCase();
      if (n) {
        result.set(`${n}:${s}`, feat);
        if (!result.has(`${n}:`)) result.set(`${n}:`, feat);
      }
    }
  }
  return result;
}

// Batch county fetch via the optimised local-DB endpoint —
// one POST with all county items, returns Map "name:state" → feature
async function fetchCountiesBatchLocal(countyItems) {
  const result = new Map();
  if (!countyItems.length) return result;
  const CHUNK = 500;
  for (let i = 0; i < countyItems.length; i += CHUNK) {
    const chunk = countyItems.slice(i, i + CHUNK);
    try {
      const r = await fetch('/api/counties-batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(chunk.map(item => ({
          name:  item.name,
          state: toStateAbbr(item.state)
        })))
      });
      const data = await r.json();
      for (const [key, feat] of Object.entries(data)) result.set(key, feat);
    } catch(e) { console.warn('counties-batch failed:', e); }
  }
  return result;
}

// Batch DMA fetch — one POST with all DMA items, returns Map item.key → {label, fc}
// fc is a FeatureCollection of the member counties (server builds it from
// the bundled Nielsen DMA↔county crosswalk).
async function fetchDmaBatch(dmaItems) {
  const result = new Map();
  if (!dmaItems.length) return result;
  try {
    const r = await fetch('/api/dma-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dmaItems.map(item => ({
        city: item.name,
        states: item.states.split('-')
      })))
    });
    const data = await r.json();
    for (const item of dmaItems) {
      const key = `${item.name.toLowerCase()}|${item.states.split('-').sort().join(',')}`;
      if (data[key]) result.set(item.key, data[key]);
    }
  } catch(e) { console.warn('dma-batch failed:', e); }
  return result;
}

async function searchLocal(q) {
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const fc = await r.json();
    return hasPolygon(fc) ? fc : null;
  } catch { return null; }
}

// Batch search — one HTTP request for many queries, returns Map<query, FC|null>
async function searchLocalBatch(queries) {
  if (!queries.length) return new Map();
  try {
    // Split into chunks of 100 to keep URL length reasonable
    const chunks = [];
    for (let i = 0; i < queries.length; i += 100)
      chunks.push(queries.slice(i, i + 100));

    const maps = await Promise.all(chunks.map(async chunk => {
      const params = new URLSearchParams();
      chunk.forEach(q => params.append('q', q));
      const r = await fetch(`/api/search-batch?${params}`);
      return r.json();
    }));

    const result = new Map();
    for (const obj of maps)
      for (const [q, fc] of Object.entries(obj))
        result.set(q, hasPolygon(fc) ? fc : null);
    return result;
  } catch { return new Map(); }
}

// ── Load excluded ─────────────────────────────────────────────────────────────
async function loadExcluded() {
  const gen = ++_excGen;
  const abort = () => _excGen !== gen;

  const rawLines = $('excInput').value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!rawLines.length) { setStat('eStat','Нет данных'); return; }

  // Check if Natural Earth data is loaded
  const st = await getServerStatus();
  if (abort()) return;
  if (!st.has_countries || !st.has_admin1) {
    setStat('eStat', '⚠️ Запустите python3 setup.py — нужны справочники стран!');
    await sleep(3000);
    if (abort()) return;
  }

  // Classify all lines first — show summary before starting
  const items = rawLines.map(classifyExcLine).filter(Boolean);
  const byType = {
    zip:    items.filter(i => i.type === 'zip'),
    state:  items.filter(i => i.type === 'state'),
    county: items.filter(i => i.type === 'county'),
    cd:     items.filter(i => i.type === 'cd'),
    dma:    items.filter(i => i.type === 'dma'),
    place:  items.filter(i => i.type === 'place'),
    radius: items.filter(i => i.type === 'radius'),
  };
  const total = items.length;
  const summary = [
    byType.zip.length    && `${byType.zip.length} ZIP`,
    byType.state.length  && `${byType.state.length} штатов`,
    byType.county.length && `${byType.county.length} округов`,
    byType.cd.length     && `${byType.cd.length} округов Конгресса`,
    byType.dma.length    && `${byType.dma.length} DMA`,
    byType.place.length  && `${byType.place.length} мест`,
    byType.radius.length && `${byType.radius.length} радиусов`,
  ].filter(Boolean).join(', ');
  setStat('eStat', `Найдено: ${summary}`);
  setProg('eProg', 2);
  await sleep(300);
  if (abort()) return;

  let done = 0, err = 0;
  const notFoundList = [];
  const tick = (label) => {
    setProg('eProg', Math.round(5 + (done + err) / total * 90));
    setStat('eStat', `${label} (${done + err}/${total})…`);
  };

  // ── 1. ZIPs — batched local DB, very fast ──
  if (byType.zip.length) {
    tick(`ZIP-коды`);
    const newZips = byType.zip.filter(i => !exclusions.has(i.key));
    const BATCH = 400;
    for (let i = 0; i < newZips.length; i += BATCH) {
      if (abort()) return;
      const batch = newZips.slice(i, i + BATCH);
      try {
        const fc = await (await fetch(`/api/zcta?zips=${batch.map(z=>z.zip).join(',')}`)).json();
        if (abort()) return;
        const foundSet = new Set(fc.features.map(f => f.properties.ZCTA5CE20 || f.properties.zip));
        for (const item of batch) {
          if (foundSet.has(item.zip)) {
            const feat = fc.features.find(f => (f.properties.ZCTA5CE20||f.properties.zip) === item.zip);
            feat.properties.display_name = item.display;
            addExclusion(item.key, item.display, { type:'FeatureCollection', features:[feat] });
            done++;
          } else { err++; notFoundList.push(item.raw); }
        }
      } catch { err += batch.length; batch.forEach(i => notFoundList.push(i.raw)); }
      tick('ZIP-коды');
    }
  }

  // ── 2. Congressional districts — one batch TIGERweb query per state group ──
  if (byType.cd.length) {
    if (abort()) return;
    tick('Округа Конгресса');
    const newCDs = byType.cd.filter(i => !exclusions.has(i.key));
    const cdMap = await fetchAllCDs(newCDs);
    if (abort()) return;
    for (const item of byType.cd) {
      if (exclusions.has(item.key)) { done++; continue; }
      const feat = cdMap.get(`${item.state}:${item.num}`);
      if (feat) {
        feat.properties.display_name = item.display;
        addExclusion(item.key, item.display, { type:'FeatureCollection', features:[feat] });
        done++;
      } else { err++; notFoundList.push(item.raw); }
    }
    tick('Округа Конгресса');
  }

  // ── 4. States (2-letter abbr only) — batch local DB → TIGERweb ──
  if (byType.state.length) {
    if (abort()) return;
    const newStates = byType.state.filter(i => !exclusions.has(i.key));
    done += byType.state.length - newStates.length;
    if (newStates.length) {
      tick('Штаты');
      const localMap = await searchLocalBatch(newStates.map(i => i.name));
      if (abort()) return;
      for (const item of newStates) {
        const fc = localMap.get(item.name);
        if (fc) {
          fc.features.forEach(f => f.properties.display_name = item.display);
          addExclusion(item.key, item.display, fc);
          done++;
        } else {
          if (abort()) return;
          try {
            const fc2 = await fetchStateBoundary(item.name);
            if (abort()) return;
            if (hasPolygon(fc2)) {
              fc2.features.forEach(f => f.properties.display_name = item.display);
              addExclusion(item.key, item.display, fc2);
              done++;
            } else { err++; notFoundList.push(item.raw); }
          } catch { err++; notFoundList.push(item.raw); }
        }
      }
      tick('Штаты');
    }
  }

  // ── 5. Counties — optimised: single POST to /api/counties-batch → TIGERweb → Nominatim ──
  if (byType.county.length) {
    if (abort()) return;
    const newCounties = byType.county.filter(i => !exclusions.has(i.key));
    done += byType.county.length - newCounties.length;

    if (newCounties.length) {
      tick('Округа');
      const localMap = await fetchCountiesBatchLocal(newCounties);
      if (abort()) return;
      const needTiger = [];
      for (const item of newCounties) {
        const stAbbr = toStateAbbr(item.state).toLowerCase();
        const feat = localMap.get(`${item.name.toLowerCase()}:${stAbbr}`)
                  || localMap.get(`${item.name.toLowerCase()}:`);
        if (feat) {
          feat.properties.display_name = item.display;
          addExclusion(item.key, item.display, { type:'FeatureCollection', features:[feat] });
          done++;
        } else needTiger.push(item);
      }

      if (needTiger.length) {
        if (abort()) return;
        const tigerMap = await fetchAllCounties(needTiger);
        if (abort()) return;
        const needNominatim = [];
        for (const item of needTiger) {
          const feat = tigerMap.get(`${item.name.toLowerCase()}:${item.state.toLowerCase()}`)
                    || tigerMap.get(`${item.name.toLowerCase()}:`);
          if (feat) {
            feat.properties.display_name = item.display;
            addExclusion(item.key, item.display, { type:'FeatureCollection', features:[feat] });
            done++;
          } else needNominatim.push(item);
        }

        for (const item of needNominatim) {
          if (abort()) return;
          tick(`Nominatim: ${item.display}`);
          try {
            const sfx = item.suffix || 'county';
            const fc = await nomSearch(`${item.name} ${sfx} ${item.state} USA`, { countrycodes:'us' });
            if (abort()) return;
            if (hasPolygon(fc)) {
              fc.features.forEach(f => f.properties.display_name = item.display);
              addExclusion(item.key, item.display, fc);
              done++;
            } else { err++; notFoundList.push(item.raw); }
          } catch { err++; notFoundList.push(item.raw); }
        }
      }
      tick('Округа');
    }
  }

  // ── 6. DMA (Nielsen media markets) — server-side union of member counties ──
  if (byType.dma.length) {
    if (abort()) return;
    const newDmas = byType.dma.filter(i => !exclusions.has(i.key));
    done += byType.dma.length - newDmas.length;
    if (newDmas.length) {
      tick('DMA-рынки');
      const dmaMap = await fetchDmaBatch(newDmas);
      if (abort()) return;
      for (const item of newDmas) {
        const result = dmaMap.get(item.key);
        if (result?.fc?.features?.length) {
          result.fc.features.forEach(f => f.properties.display_name = item.display);
          addExclusion(item.key, item.display, result.fc);
          done++;
        } else { err++; notFoundList.push(item.raw); }
      }
      tick('DMA-рынки');
    }
  }

  // ── 7. Places: countries, provinces, states by full name, cities ──
  if (byType.place.length) {
    if (abort()) return;
    const newPlaces = byType.place.filter(i => !exclusions.has(i.key));
    done += byType.place.length - newPlaces.length;

    if (newPlaces.length) {
      setStat('eStat', `Поиск в базе… (${done}/${total})`);
      const dbMap = await searchLocalBatch(newPlaces.map(i => i.query));
      if (abort()) return;

      const needNominatim = [];
      for (const item of newPlaces) {
        const fc = dbMap.get(item.query);
        if (fc) {
          const label = fc.features[0]?.properties?.display_name || item.display;
          fc.features.forEach(f => f.properties.display_name = label);
          addExclusion(item.key, label, fc);
          done++;
        } else {
          needNominatim.push(item);
        }
      }
      tick('База данных');

      for (const item of needNominatim) {
        if (abort()) return;
        tick(`Nominatim: ${item.display}`);
        try {
          let fc = await nomSearch(item.query, { countrycodes:'us' });
          if (abort()) return;
          if (!hasPolygon(fc)) fc = await nomSearch(item.query);
          if (abort()) return;
          if (hasPolygon(fc)) {
            const label = fc.features[0]?.properties?.display_name || item.display;
            fc.features.forEach(f => f.properties.display_name = label);
            addExclusion(item.key, label, fc);
            done++;
          } else { err++; notFoundList.push(item.raw); }
        } catch { err++; notFoundList.push(item.raw); }
        tick('Места');
      }
    }
  }

  // ── 8. Radius circles — batched parallel (10 at a time to avoid hammering Photon) ──
  if (byType.radius.length) {
    if (abort()) return;
    const newRadii = byType.radius.filter(i => !exclusions.has(i.key));
    done += byType.radius.length - newRadii.length;
    if (newRadii.length) {
      let rDone = 0;
      tick(`Радиусы (0/${newRadii.length})…`);
      const radiusResults = [];
      for (let i = 0; i < newRadii.length; i += 10) {
        if (abort()) return;
        const batch = newRadii.slice(i, i + 10);
        const res = await Promise.all(batch.map(async item => {
          try { const fc = await fetchRadius(item); tick(`Радиусы (${++rDone}/${newRadii.length})…`); return { item, fc }; }
          catch { return { item, fc: null }; }
        }));
        radiusResults.push(...res);
      }
      if (abort()) return;
      for (const { item, fc } of radiusResults) {
        if (fc?.features?.length) {
          addExclusion(item.key, item.display, fc);
          done++;
        } else { err++; notFoundList.push(item.raw); }
      }
    }
  }

  if (abort()) return;
  scheduleOverlap();
  setProg('eProg', 100);
  const parts = [`✅ <b>${done}</b>/${total} загружено`];
  if (notFoundList.length) {
    const listHtml = notFoundList.map(s => `<span style="color:#c62828">• ${s}</span>`).join('<br>');
    setStat('eStat',
      parts.join(' · ') +
      ` · ⚠️ не найдено: <b>${notFoundList.length}</b>` +
      `<div style="margin-top:4px;line-height:1.6">${listHtml}</div>`
    );
  } else {
    setStat('eStat', parts.join(' · '));
  }
}

  setProg('nProg', 100);
  if (neuLayer.getLayers().length) map.fitBounds(neuLayer.getBounds(), {padding:[30,30]});

  const parts = [`✅ <b>${loaded}</b>/${total} загружено`];
  if (notFoundList.length) {
    const listHtml = notFoundList.map(s => `<span style="color:#c62828">• ${s}</span>`).join('<br>');
    setStat('nStat', parts.join(' · ') + ` · ⚠️ не найдено: <b>${notFoundList.length}</b><div style="margin-top:4px;line-height:1.6">${listHtml}</div>`);
  } else {
    setStat('nStat', parts.join(' · '));
  }
}

function clearNeutral() {
  ++_neuGen;
  hideTipNow();
  $('neuInput').value = '';
  neuLayer.clearLayers();
  neuLayers.clear();
  setProg('nProg', 0); setStat('nStat', 'Готов');
}
</script>
</body>
</html>
