<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ZIP Code Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
         display:flex;height:100vh;overflow:hidden;background:#f0f2f5}

    /* ── Sidebar ──────────────────────────────────────────────── */
    #sidebar{
      width:300px;min-width:240px;display:flex;flex-direction:column;
      background:#fff;border-right:1px solid #dde1e7;
      box-shadow:2px 0 8px rgba(0,0,0,.08);z-index:1000;overflow:hidden
    }
    .panel{
      display:flex;flex-direction:column;gap:7px;
      padding:12px 11px;flex:1;min-height:0;overflow:hidden
    }
    .panel+.panel{border-top:2px solid #e8eaed}

    .panel-title{
      font-size:11px;font-weight:700;letter-spacing:.5px;
      text-transform:uppercase;display:flex;align-items:center;gap:5px;flex-shrink:0
    }
    .dot{width:11px;height:11px;border-radius:2px;flex-shrink:0}
    .dot-blue{background:#1a73e8}.dot-red{background:#d93025}

    textarea{
      flex:1;min-height:60px;padding:7px 8px;
      font-size:11.5px;font-family:"SF Mono","Courier New",monospace;
      border:1px solid #dadce0;border-radius:5px;background:#fafafa;
      color:#202124;resize:none;outline:none;line-height:1.55;transition:border-color .15s
    }
    #incInput:focus{border-color:#1a73e8;background:#fff}
    #excInput:focus{border-color:#d93025;background:#fff}

    .btn-row{display:flex;gap:5px;flex-shrink:0}
    button{
      flex:1;padding:7px 4px;border:none;border-radius:5px;cursor:pointer;
      font-size:11.5px;font-weight:600;transition:opacity .15s
    }
    button:hover{opacity:.85} button:active{transform:scale(.97)}
    .btn-inc{background:#1a73e8;color:#fff}
    .btn-exc{background:#d93025;color:#fff}
    .btn-clr{background:#fff;color:#5f6368;border:1px solid #dadce0}

    .prog-wrap{background:#e8eaed;border-radius:3px;height:3px;flex-shrink:0}
    .prog-bar{height:100%;border-radius:3px;width:0%;transition:width .3s}
    .pb-blue{background:#1a73e8}.pb-red{background:#d93025}
    .status{font-size:11px;color:#5f6368;min-height:14px;flex-shrink:0}
    .status b{color:#202124}

    /* ── Legend ───────────────────────────────────────────────── */
    #legend{padding:9px 11px;border-top:1px solid #e8eaed;font-size:10.5px;color:#80868b;line-height:1.9;flex-shrink:0}
    .leg{display:flex;align-items:center;gap:5px}
    .sw{width:14px;height:9px;border-radius:2px;flex-shrink:0}

    /* ── Map ──────────────────────────────────────────────────── */
    #map{flex:1}

    /* ── Floating tooltip ─────────────────────────────────────── */
    #ft{
      position:fixed;display:none;z-index:9999;min-width:170px;max-width:240px;
      background:#fff;border:1px solid #dadce0;border-radius:8px;
      box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:12px;pointer-events:none
    }
    #ft.on{display:block;pointer-events:auto}
    #ft .fh{padding:8px 12px 5px;font-weight:700;font-size:13px;border-bottom:1px solid #f1f3f4}
    #ft .fs{padding:3px 12px 4px;color:#5f6368;font-size:11px;min-height:18px}
    #ft .fa{padding:5px 7px 7px;display:flex;flex-direction:column;gap:3px}
    .tb{
      width:100%;padding:5px 9px;border:none;border-radius:5px;text-align:left;
      cursor:pointer;font-size:11.5px;font-weight:500;transition:background .1s
    }
    .tb-r{background:#fff3f3;color:#c62828}.tb-r:hover{background:#fce8e6}
    .tb-b{background:#e8f0fe;color:#1558b0}.tb-b:hover{background:#d2e3fc}
    .tb-g{background:#f8f9fa;color:#5f6368}.tb-g:hover{background:#f1f3f4}

    .leaflet-tooltip{
      background:#1a73e8;border:none;color:#fff;font-weight:700;
      font-size:12px;padding:3px 8px;border-radius:4px;
      box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none
    }
    .leaflet-tooltip.rt{background:#c62828}
    .leaflet-tooltip::before{display:none}
  </style>
</head>
<body>

<div id="sidebar">

  <div class="panel">
    <div class="panel-title"><span class="dot dot-blue"></span>Included areas</div>
    <textarea id="incInput" placeholder="ZIP-коды:&#10;16112, Pennsylvania, US&#10;16116&#10;90210"></textarea>
    <div class="btn-row">
      <button class="btn-inc" onclick="loadIncluded()">▶ Показать</button>
      <button class="btn-clr" onclick="clearIncluded()">✕</button>
    </div>
    <div class="prog-wrap"><div class="prog-bar pb-blue" id="iProg"></div></div>
    <div class="status" id="iStat">Готов</div>
  </div>

  <div class="panel">
    <div class="panel-title"><span class="dot dot-red"></span>Excluded areas</div>
    <textarea id="excInput" placeholder="ZIP, штат, округ, город:&#10;16117&#10;PA&#10;Pennsylvania&#10;Allegheny County, PA&#10;Lawrence County&#10;Pittsburgh"></textarea>
    <div class="btn-row">
      <button class="btn-exc" onclick="loadExcluded()">▶ Показать</button>
      <button class="btn-clr" onclick="clearExcluded()">✕</button>
    </div>
    <div class="prog-wrap"><div class="prog-bar pb-red" id="eProg"></div></div>
    <div class="status" id="eStat">Готов</div>
  </div>

  <div id="legend">
    <div class="leg"><span class="sw" style="background:rgba(26,115,232,.22);border:1.5px solid #1a73e8"></span>Включённые ZIP</div>
    <div class="leg"><span class="sw" style="background:rgba(198,40,40,.28);border:1.5px solid #d93025"></span>Исключённые зоны</div>
    <div class="leg"><span class="sw" style="background:rgba(198,40,40,.55);border:2px solid #b71c1c"></span>Пересечение — блокировка</div>
    <div style="margin-top:3px;font-size:10px">Наведите на зону → меню исключения</div>
  </div>
</div>

<div id="map"></div>

<div id="ft">
  <div class="fh" id="fh"></div>
  <div class="fs" id="fs"></div>
  <div class="fa" id="fa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([39.5,-98.35],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

const incLayer = L.featureGroup().addTo(map);
const excLayer = L.featureGroup().addTo(map);

// ── State ─────────────────────────────────────────────────────────────────────
const exclusions   = new Map();   // key → {name, lyr}
const zipCtxCache  = new Map();   // zip → context object
let   serverStatus = null;        // /api/status result

// ── Nominatim rate limiter ────────────────────────────────────────────────────
let _nomLast = 0;
async function nominatim(path) {
  const wait = Math.max(0, 1150 - (Date.now() - _nomLast));
  if (wait) await sleep(wait);
  _nomLast = Date.now();
  const r = await fetch('https://nominatim.openstreetmap.org' + path, {
    headers: {'Accept-Language':'en-US,en','User-Agent':'ZipCodeMapTool/1.0'}
  });
  return r.json();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r,ms));
function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'") }
function setStat(id,h){ $(id).innerHTML = h }
function setProg(id,p){ $(id).style.width = p+'%' }

function parseZips(txt){
  const s=new Set();
  for(const l of txt.split('\n')){const m=l.match(/\b(\d{5})\b/);if(m)s.add(m[1])}
  return[...s]
}

async function getServerStatus(){
  if(serverStatus) return serverStatus;
  try{ serverStatus = await(await fetch('/api/status')).json(); }
  catch{ serverStatus = {has_zcta:false,has_states:false,has_counties:false}; }
  return serverStatus;
}

// ── Floating tooltip ──────────────────────────────────────────────────────────
const ft = $('ft');
let ftActive = false;

function showTip(e, head, sub, actions){
  $('fh').innerHTML = head;
  $('fs').innerHTML = sub || '';
  $('fa').innerHTML = actions;
  ft.classList.add('on');
  ftActive = true;
  posTip(e);
}
function posTip(e){
  const x = e.originalEvent ? e.originalEvent.clientX : e.clientX;
  const y = e.originalEvent ? e.originalEvent.clientY : e.clientY;
  const w = ft.offsetWidth||200, h = ft.offsetHeight||130;
  ft.style.left = (x+16+w>window.innerWidth ? x-w-8 : x+16)+'px';
  ft.style.top  = (y+16+h>window.innerHeight ? y-h-8 : y+16)+'px';
}
function hideTip(){ ft.classList.remove('on'); ftActive=false; }
ft.addEventListener('mouseleave', hideTip);
map.on('click', hideTip);

// ── Styles ────────────────────────────────────────────────────────────────────
const SI  = {color:'#1a73e8',fillColor:'#1a73e8',fillOpacity:.2,weight:1.5};
const SIH = {color:'#1558b0',fillColor:'#1a73e8',fillOpacity:.5,weight:2.5};
const SE  = {color:'#d93025',fillColor:'#c62828',fillOpacity:.28,weight:1.5};
const SEH = {color:'#b71c1c',fillColor:'#c62828',fillOpacity:.55,weight:2.5};

// ── Build included layer ──────────────────────────────────────────────────────
function buildIncLayer(fc){
  return L.geoJSON(fc,{
    style:SI,
    onEachFeature(feat,lyr){
      const zip = feat.properties.ZCTA5CE20 || feat.properties.zip;
      lyr.bindTooltip(`ZIP ${zip}`,{sticky:true,offset:[10,0]});
      lyr.on('mouseover', async function(e){
        this.setStyle(SIH); this.bringToFront();
        showTip(e, `ZIP ${zip}`, '<i>определяю округ…</i>', buildIncActions(zip,null));
        const ctx = await loadZipCtx(zip, lyr.getBounds());
        if(ftActive) showTip(e, `ZIP ${zip}`,
          ctx ? formatLoc(ctx) : '',
          buildIncActions(zip, ctx)
        );
      });
      lyr.on('mousemove', e=>{ if(ftActive) posTip(e); });
      lyr.on('mouseout',  function(){ this.setStyle(SI); hideTip(); });
    }
  });
}

function buildIncActions(zip, ctx){
  const a = [`<button class="tb tb-r" onclick="excludeAsZip('${zip}')">🚫 Исключить ZIP ${zip}</button>`];
  if(ctx?.county_name)
    a.push(`<button class="tb tb-r" onclick="excludeAsCounty('${esc(ctx.county_fips||'')}','${esc(ctx.county_name)}','${esc(ctx.state_abbr||'')}','${esc(ctx.state_name||'')}')">🚫 Исключить County: ${ctx.county_name}</button>`);
  if(ctx?.state_name)
    a.push(`<button class="tb tb-r" onclick="excludeAsState('${esc(ctx.state_fips||'')}','${esc(ctx.state_name)}','${esc(ctx.state_abbr||'')}')">🚫 Исключить State: ${ctx.state_name}</button>`);
  a.push(`<button class="tb tb-g" onclick="hideTip()">✕ Закрыть</button>`);
  return a.join('');
}

function formatLoc(ctx){
  const parts=[];
  if(ctx.county_name) parts.push(ctx.county_name);
  if(ctx.state_abbr)  parts.push(ctx.state_abbr);
  return parts.join(', ');
}

// ── ZIP context lookup ────────────────────────────────────────────────────────
async function loadZipCtx(zip, bounds){
  if(zipCtxCache.has(zip)) return zipCtxCache.get(zip);
  const st = await getServerStatus();

  let ctx = null;
  if(st.has_counties){
    try{
      const r = await fetch(`/api/zip-context?zip=${zip}`);
      ctx = await r.json();
    }catch{}
  }

  // Fallback: Nominatim reverse geocode
  if(!ctx?.county_name){
    try{
      const c = bounds.getCenter();
      const rev = await nominatim(`/reverse?lat=${c.lat}&lon=${c.lng}&format=json&addressdetails=1&zoom=10`);
      const a = rev.address||{};
      const sc = (a['ISO3166-2-lvl4']||'').replace(/^US-/,'');
      ctx = {
        county_name: a.county||a.city_district||'',
        state_name:  a.state||'',
        state_abbr:  sc||a.state_code||'',
        county_fips: null, state_fips: null,
        _nominatim_county: a.county||a.city_district||'',
        _nominatim_state:  a.state||'',
        _state_abbr:       sc
      };
    }catch{}
  }

  if(ctx) zipCtxCache.set(zip, ctx);
  return ctx;
}

// ── Build excluded layer ──────────────────────────────────────────────────────
function buildExcLayer(fc, key){
  return L.geoJSON(fc,{
    style:SE,
    onEachFeature(feat,lyr){
      const name = feat.properties.display_name||key;
      lyr.bindTooltip(name,{sticky:true,offset:[10,0],className:'rt'});
      lyr.on('mouseover', function(e){
        this.setStyle(SEH); this.bringToFront();
        showTip(e,
          `<span style="color:#c62828">${name}</span>`,
          'Исключённая зона',
          `<button class="tb tb-b" onclick="removeExclusion('${esc(key)}')">✅ Убрать из исключений</button>
           <button class="tb tb-g" onclick="hideTip()">✕ Закрыть</button>`
        );
      });
      lyr.on('mousemove', e=>{ if(ftActive) posTip(e); });
      lyr.on('mouseout',  function(){ this.setStyle(SE); hideTip(); });
    }
  });
}

// ── Exclude actions ───────────────────────────────────────────────────────────
async function excludeAsZip(zip){
  hideTip();
  const key=`zip:${zip}`;
  if(exclusions.has(key)) return;
  try{
    const fc = await(await fetch(`/api/zcta?zips=${zip}`)).json();
    fc.features.forEach(f=>f.properties.display_name=`ZIP ${zip}`);
    addExclusion(key, `ZIP ${zip}`, fc);
    appendExcTA(zip);
  }catch(e){ console.error(e); }
}

async function excludeAsCounty(fips, name, stAbbr, stName){
  hideTip();
  const label = `${name}${stAbbr?', '+stAbbr:''}`;
  const key = `county:${fips||label}`;
  if(exclusions.has(key)) return;

  const st = await getServerStatus();
  let fc = null;

  if(fips && st.has_counties){
    try{ fc = await(await fetch(`/api/search?q=${encodeURIComponent(name+(stAbbr?', '+stAbbr:''))}`)).json(); }catch{}
  }
  if(!fc?.features?.length){
    // Nominatim fallback
    const q = name + (stAbbr ? ` county ${stAbbr}` : ' county') + ' USA';
    const r = await nominatim(`/search?q=${encodeURIComponent(q)}&format=geojson&polygon_geojson=1&limit=1&countrycodes=us`);
    fc = r;
  }
  if(fc?.features?.length){
    fc.features.forEach(f=>f.properties.display_name=label);
    addExclusion(key, label, fc);
    appendExcTA(label);
  }
}

async function excludeAsState(fips, name, abbr){
  hideTip();
  const key = `state:${fips||name}`;
  if(exclusions.has(key)) return;
  const display = name||(abbr?'State '+abbr:'');

  const st = await getServerStatus();
  let fc = null;

  if(st.has_states){
    try{ fc = await(await fetch(`/api/search?q=${encodeURIComponent(abbr||name)}`)).json(); }catch{}
  }
  if(!fc?.features?.length){
    const q = (name||abbr) + ' state USA';
    const r = await nominatim(`/search?q=${encodeURIComponent(q)}&format=geojson&polygon_geojson=1&limit=1&countrycodes=us`);
    fc = r;
  }
  if(fc?.features?.length){
    fc.features.forEach(f=>f.properties.display_name=display);
    addExclusion(key, display, fc);
    appendExcTA(abbr||name);
  }
}

function addExclusion(key, name, fc){
  if(exclusions.has(key)) return;
  const lyr = buildExcLayer(fc, key).addTo(excLayer);
  exclusions.set(key, {name, lyr});
  updateExcStat();
}

function removeExclusion(key){
  hideTip();
  const e = exclusions.get(key);
  if(!e) return;
  excLayer.removeLayer(e.lyr);
  exclusions.delete(key);
  // Remove from textarea
  const ta=$('excInput');
  const lines = ta.value.split('\n').filter(l=>l.trim()!==e.name&&l.trim()!=='');
  ta.value = lines.join('\n');
  updateExcStat();
}

function appendExcTA(line){
  const ta=$('excInput'), v=ta.value.trim();
  const lines = v?v.split('\n'):[];
  if(!lines.some(l=>l.trim()===line.trim())) ta.value=(v?v+'\n':'')+line;
}

function updateExcStat(){
  const n=exclusions.size;
  setStat('eStat', n?`<b>${n}</b> зон исключено`:'Готов');
}

// ── Load included ─────────────────────────────────────────────────────────────
async function loadIncluded(){
  const zips = parseZips($('incInput').value);
  if(!zips.length){ setStat('iStat','Нет ZIP-кодов'); return; }
  clearIncluded(); setProg('iProg',2);

  const BATCH=400;
  const batches=[];
  for(let i=0;i<zips.length;i+=BATCH) batches.push(zips.slice(i,i+BATCH));

  let loaded=0, notFound=[];
  for(let i=0;i<batches.length;i++){
    setStat('iStat',`Батч ${i+1}/${batches.length}…`);
    setProg('iProg', Math.round(5 + i/batches.length*90));
    try{
      const fc = await(await fetch(`/api/zcta?zips=${batches[i].join(',')}`)).json();
      const found = new Set(fc.features.map(f=>f.properties.ZCTA5CE20||f.properties.zip));
      batches[i].filter(z=>!found.has(z)).forEach(z=>notFound.push(z));
      loaded += found.size;
      if(fc.features.length) buildIncLayer(fc).addTo(incLayer);
    }catch(e){ setStat('iStat',`❌ ${e.message}`); }
  }
  setProg('iProg',100);
  if(incLayer.getLayers().length) map.fitBounds(incLayer.getBounds(),{padding:[30,30]});
  const p=[`✅ <b>${loaded}</b>/${zips.length} загружено`];
  if(notFound.length) p.push(`⚠️ не найдено: <b>${notFound.length}</b>`);
  setStat('iStat', p.join(' · '));
}

// ── Load excluded ─────────────────────────────────────────────────────────────
async function loadExcluded(){
  const lines = $('excInput').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ setStat('eStat','Нет данных'); return; }
  setProg('eProg',2);

  let done=0, err=0;
  for(const line of lines){
    setStat('eStat',`Ищу: ${line}…`);
    try{
      // Try local API first, then Nominatim
      const isZip = /^\d{5}$/.test(line);
      const key = `search:${line}`;
      if(exclusions.has(key)){ done++; continue; }

      let fc = null;
      if(isZip){
        fc = await(await fetch(`/api/zcta?zips=${line}`)).json();
        fc.features.forEach(f=>f.properties.display_name=`ZIP ${line}`);
      } else {
        const local = await(await fetch(`/api/search?q=${encodeURIComponent(line)}`)).json();
        if(local.features?.length){
          fc = local;
        } else {
          // Nominatim fallback
          const r = await nominatim(`/search?q=${encodeURIComponent(line+' USA')}&format=geojson&polygon_geojson=1&limit=1&countrycodes=us`);
          if(r.features?.length){
            const name = r.features[0].properties.display_name?.split(',')[0]||line;
            r.features.forEach(f=>f.properties.display_name=name);
            fc = r;
          }
        }
      }

      if(fc?.features?.length){
        const name = fc.features[0].properties.display_name||line;
        addExclusion(key, name, fc);
        done++;
      } else { err++; }
    }catch(e){ err++; console.error(line,e); }
    setProg('eProg', Math.round(5 + (done+err)/lines.length*90));
  }
  setProg('eProg',100);
  const p=[`✅ <b>${done}</b> загружено`];
  if(err) p.push(`⚠️ не найдено: <b>${err}</b>`);
  setStat('eStat', p.join(' · '));
}

// ── Clear ─────────────────────────────────────────────────────────────────────
function clearIncluded(){ incLayer.clearLayers(); setProg('iProg',0); setStat('iStat','Очищено'); }
function clearExcluded(){ excLayer.clearLayers(); exclusions.clear(); setProg('eProg',0); setStat('eStat','Очищено'); }
</script>
</body>
</html>
